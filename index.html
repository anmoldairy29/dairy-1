<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥛 Anmol Dairy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Anmol Dairy 🥛</div>
            <ul>
                <li><a href="#" id="home-link" class="active">Home</a></li>
                <li><a href="#" id="records-link">Records</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home-page" class="page active-page">
            <h2>Daily Milk Entry</h2>
            <form id="daily-milk-form">
                <div class="form-group">
                    <label for="customer-select">Customer Name:</label>
                    <select id="customer-select" required></select>
                </div>
                <div class="form-group">
                    <label for="liters-input-home">Liters Today:</label>
                    <input type="number" id="liters-input-home" step="0.5" placeholder="Liters" required>
                </div>
                <button type="submit">Submit Milk Data</button>
            </form>
            
            <hr>

            <h2>Customer List</h2>
            <div class="search-bar">
                <input type="text" id="home-search-input" placeholder="Search by name...">
            </div>
            <div class="table-container">
                <table id="home-customer-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Mobile Number</th>
                            <th class="actions-col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="home-customer-list">
                        </tbody>
                </table>
            </div>

            <hr>

            <h2>Manage Customers</h2>
            <form id="customer-form">
                <input type="hidden" id="customer-id">
                <input type="text" id="customer-name" placeholder="Customer Name" required>
                <input type="tel" id="customer-mobile" placeholder="Mobile Number" required>
                <button type="submit" id="submit-btn">Add Customer</button>
            </form>
        </section>
        
        <section id="records-page" class="page hidden-page">
            <h2>Payment Records</h2>
            <div class="table-container">
                <table id="records-customer-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th class="payment-col">Payment</th>
                            <th class="actions-col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="records-customer-list">
                        </tbody>
                </table>
            </div>
        </section>

        <section id="milk-records-view" class="page hidden-page">
            <div class="record-header">
                <button id="back-btn">← Back to Records</button>
                <h2 id="milk-records-heading"></h2>
            </div>
            <p class="total-liters">Total Liters this month: <strong id="monthly-total-liters">0</strong></p>
            <div class="calendar-container">
                <h3 class="month-title">Current Month's Records</h3>
                <table id="milk-records-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Liters</th>
                        </tr>
                    </thead>
                    <tbody id="milk-records-list">
                        </tbody>
                </table>
            </div>
        </section>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
